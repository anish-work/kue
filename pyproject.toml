[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kue"
version = "0.1.0"
description = "Local-first orchestrator that routes discovered work to a coding agent."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "typer>=0.12",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
kue = "kue.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/kue"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
